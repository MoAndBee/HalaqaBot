name = "halaqabot"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set with `bunx wrangler secret put <NAME>`, never committed):
#   BOT_TOKEN, GROQ_API_KEY, FORWARD_CHAT_ID, CONVEX_URL, TELEGRAM_WEBHOOK_SECRET
#
# Optional, with defaults in src/config/environment.ts:
#   CHANNEL_ID, WEB_APP_URL (also the only origin allowed to call /api/*),
#   AUTO_REACTION_EMOJI, ALLOWED_REACTION_USER_IDS

# Jobs too slow for an HTTP request (see src/jobs.ts). Each consumer runs one
# job at a time; imports have their own queue so they never hold up updates.
[[queues.producers]]
binding = "UPDATES"
queue = "halaqabot-updates"

[[queues.producers]]
binding = "IMPORTS"
queue = "halaqabot-imports"

[[queues.consumers]]
queue = "halaqabot-updates"
max_batch_size = 1
max_concurrency = 1
max_retries = 2
retry_delay = 10

[[queues.consumers]]
queue = "halaqabot-imports"
max_batch_size = 1
max_concurrency = 1
max_retries = 2
retry_delay = 10

[triggers]
# Channel registration + admin reconciliation. Admin changes normally arrive as
# chat_member updates; this catches any that were missed.
crons = ["17 * * * *"]

[[rules]]
type = "Data"
globs = ["**/*.jpeg"]
fallthrough = true

[observability]
enabled = true

# A preview of the bot that talks to the Telegram simulator instead of Telegram
# (packages/testing, deployed as halaqabot-telegram-sim), with its own queues.
# Deploy with `bun run deploy:preview`. Its secrets are set per environment
# (`bunx wrangler secret put <NAME> --env preview`): the same as production,
# with BOT_TOKEN matching the simulator's SIM_BOT_TOKEN and CONVEX_URL a dev or
# preview deployment, plus
#   TELEGRAM_API_ROOT = https://halaqabot-telegram-sim.<account>.workers.dev
#   GROQ_BASE_URL     = https://halaqabot-telegram-sim.<account>.workers.dev/groq/openai/v1
[env.preview]
name = "halaqabot-preview"

[[env.preview.queues.producers]]
binding = "UPDATES"
queue = "halaqabot-preview-updates"

[[env.preview.queues.producers]]
binding = "IMPORTS"
queue = "halaqabot-preview-imports"

[[env.preview.queues.consumers]]
queue = "halaqabot-preview-updates"
max_batch_size = 1
max_concurrency = 1
max_retries = 2
retry_delay = 10

[[env.preview.queues.consumers]]
queue = "halaqabot-preview-imports"
max_batch_size = 1
max_concurrency = 1
max_retries = 2
retry_delay = 10
