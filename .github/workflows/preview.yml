# A working preview of each pull request, with no Telegram account needed: the
# bot, a simulated Telegram, the web app and Convex. The PR gets a comment with
# the simulator's dashboard, where you act as any user and the Mini App runs
# alongside. See packages/testing/scripts/preview.ts.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN              Workers Scripts + Queues: Edit
#   CLOUDFLARE_ACCOUNT_ID
#   CONVEX_PREVIEW_DEPLOY_KEY         a Preview deploy key (Convex Pro), or a dev
#                                     deploy key to share one dev deployment
#   PREVIEW_CONVEX_AUTH_PRIVATE_KEY   from packages/bot/scripts/generate-auth-key.ts;
#                                     its JWKS must be the Convex project's default
#                                     CONVEX_AUTH_JWKS for preview deployments
#   PREVIEW_CONTROL_TOKEN             any long random string
# Without them (e.g. PRs from forks), previews are skipped.

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# One run per PR at a time, and a deploy is never cut off halfway; closing the
# PR waits for it, then removes the preview.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for preview secrets
        id: enabled
        run: echo "ok=${{ env.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.enabled.outputs.ok == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.enabled.outputs.ok == 'true'
      - run: bun install --frozen-lockfile
        if: steps.enabled.outputs.ok == 'true'

      - name: Deploy the preview
        id: preview
        if: steps.enabled.outputs.ok == 'true'
        working-directory: packages/testing
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          PREVIEW_CONVEX_AUTH_PRIVATE_KEY: ${{ secrets.PREVIEW_CONVEX_AUTH_PRIVATE_KEY }}
          PREVIEW_CONTROL_TOKEN: ${{ secrets.PREVIEW_CONTROL_TOKEN }}
          # Each PR's simulated users and chats get IDs of their own.
          PREVIEW_ID_OFFSET: ${{ github.event.pull_request.number }}000000
        run: bun scripts/preview.ts deploy "$PREVIEW_NAME"

      - name: Comment on the PR
        if: steps.enabled.outputs.ok == 'true' && always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.preview.outcome }}
          DASHBOARD: ${{ steps.preview.outputs.dashboard }}
          WEB_APP: ${{ steps.preview.outputs.web_app }}
          CHECKS: ${{ steps.preview.outputs.checks }}
          CONTROL_TOKEN: ${{ secrets.PREVIEW_CONTROL_TOKEN }}
        with:
          script: |
            const marker = "<!-- halaqabot-preview -->";
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Only a private repo's PR comments may carry the control token.
            const link = context.payload.repository.private
              ? `${process.env.DASHBOARD}/#token=${process.env.CONTROL_TOKEN}`
              : process.env.DASHBOARD;
            const body = process.env.OUTCOME === "success"
              ? [
                  marker,
                  `### 🧪 Preview of ${sha}: no Telegram account needed`,
                  ``,
                  `**[Open the simulator](${link})**: act as the owner, an admin or a student, post, comment, react 👌; the Mini App runs alongside, signed in as whoever you act as.`,
                  ``,
                  `Web app: ${process.env.WEB_APP}`,
                  ``,
                  `Checked after deploying: ${process.env.CHECKS.split("; ").map((c) => "✓ " + c).join(" · ")}`,
                  ...(context.payload.repository.private ? [] : [``, `The dashboard asks for the control token (the PREVIEW_CONTROL_TOKEN secret).`]),
                ].join("\n")
              : [marker, `### 🧪 Preview of ${sha} failed`, ``, `See the [workflow run](${run}).`].join("\n");

            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  destroy:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for preview secrets
        id: enabled
        run: echo "ok=${{ env.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.enabled.outputs.ok == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.enabled.outputs.ok == 'true'
      - run: bun install --frozen-lockfile
        if: steps.enabled.outputs.ok == 'true'
      - name: Remove the preview
        if: steps.enabled.outputs.ok == 'true'
        working-directory: packages/testing
        run: bun scripts/preview.ts destroy "$PREVIEW_NAME"
